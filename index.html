<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCAD Trace Kasindi</title><link rel="stylesheet" href="web-core/styles.css"></head>
<body><header><div class="brand"><img src="assets/LOGO.jpg" alt="Logo ACCAD"><div><strong>ACCAD Trace</strong><div>Kasindi · Vérification</div></div></div></header>
<main><section class="card" id="login-card"><h1>Connexion agent</h1><p class="muted">Accès réservé aux agents de vérification de Kasindi.</p><form id="login-form"><label for="identifier">ID agent ou téléphone</label><input id="identifier" required><label for="code">Code agent</label><div class="password-field"><input id="code" type="password" required autocomplete="current-password"><button type="button" id="toggle-code" class="toggle-code" aria-label="Afficher le code agent" aria-pressed="false">Afficher</button></div><button type="submit">Se connecter</button></form><div id="login-status" class="status" hidden></div></section>
<section class="card" id="home-card" hidden><h1>Bienvenue <span id="agent-name"></span></h1><p>Site : KASINDI · Rôle : VERIFICATION</p><div class="grid"><button id="scan">Scanner un QR Code</button><button id="manual">Saisir une référence</button><button id="history">Historique</button></div></section>
<section class="card" id="workspace" hidden><h2 id="workspace-title"></h2><div id="workspace-content"></div></section></main>
<script src="web-core/config.js"></script><script src="app.js"></script></body></html>
