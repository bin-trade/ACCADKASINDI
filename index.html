<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b60"><title>ACCAD Trace Kasindi</title><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/LOGO.jpg"><link rel="stylesheet" href="web-core/app.css"></head>
<body><header class="app-header"><div class="brand"><img src="assets/LOGO.jpg" alt="Logo ACCAD"><div><strong>ACCAD Trace</strong><small>Kasindi · Vérification</small></div></div><div class="chips top-actions"><span id="net-chip" class="chip">…</span><span id="session-chip" class="chip ok" hidden></span><span id="sync-chip" class="chip ok" hidden></span></div></header><main><section class="card" id="login-card"><h1>Connexion agent</h1><p class="muted">Accès réservé aux agents de vérification de Kasindi.</p><form id="login-form" novalidate><label for="identifier">ID agent ou téléphone</label><input id="identifier" data-upper autocomplete="username" required><label for="code">Code agent</label><div class="password-field"><input id="code" type="password" inputmode="numeric" autocomplete="current-password" required><button type="button" id="toggle-code" class="secondary" aria-pressed="false">Afficher</button></div><div class="row"><button type="submit">Se connecter</button></div></form><div id="login-status" aria-live="polite"></div></section><section class="card" id="home-card" hidden><h1>Bienvenue <span id="agent-name"></span></h1><p id="agent-meta" class="muted"></p><div id="agent-balance" class="balance" aria-live="polite"></div><div class="grid"><button id="scan">Scanner un QR Code</button><button id="bulongo">Enregistrer Bulongo</button><button id="reversements">Reversements</button><button id="history">Historique</button><button id="sync">Synchronisation</button><button id="logout" class="secondary">Quitter</button></div><p id="last-sync" class="muted"></p><p id="others-note" class="muted" hidden></p><div id="sync-message" aria-live="polite"></div></section>
<section class="card" id="workspace" hidden><div class="row" style="margin:0 0 8px"><button id="back-home" class="secondary" style="flex:0 0 auto">← Accueil</button></div><h2 id="workspace-title"></h2><div id="workspace-content"></div></section></main><div id="toasts"></div><div id="live" class="sr-only" role="status" aria-live="polite"></div>
<script src="web-core/config.js"></script><script src="web-core/theme.js"></script><script src="web-core/core.js"></script><script src="web-core/auth.js"></script><script src="web-core/sync.js"></script><script src="web-core/vendor/qrcode.js"></script><script src="web-core/receipt.js"></script><script src="web-core/app-common.js"></script><script src="web-core/app-ops.js"></script><script src="web-core/vendor/jsQR.js"></script><script src="web-core/scanner.js"></script><script src="web-core/verify.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');</script></body></html>
